syntax = "proto3";

package audit.v1;

option go_package = "github.com/MuhibNayem/Travio/server/api/proto/audit/v1;auditv1";

import "google/protobuf/timestamp.proto";

// AuditService provides write-only audit logging
service AuditService {
  // Log creates a new audit log entry (append-only)
  rpc Log(LogRequest) returns (LogResponse);
  
  // GetByActorID retrieves audit logs by actor ID
  rpc GetByActorID(GetByActorIDRequest) returns (GetAuditLogsResponse);
  
  // GetByResourceID retrieves audit logs by resource/aggregate ID
  rpc GetByResourceID(GetByResourceIDRequest) returns (GetAuditLogsResponse);
  
  // GetByTimeRange retrieves audit logs within a time range
  rpc GetByTimeRange(GetByTimeRangeRequest) returns (GetAuditLogsResponse);
}

message LogRequest {
  string aggregate_id = 1;
  string event_type = 2;
  string resource_type = 3;
  string action = 4;
  string actor_id = 5;
  string actor_type = 6;
  string organization_id = 7;
  string ip_address = 8;
  string user_agent = 9;
  string details = 10; // JSON string
  string status = 11;
  string failure_reason = 12;
}

message LogResponse {
  string id = 1;
  bool success = 2;
}

message GetByActorIDRequest {
  string actor_id = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message GetByResourceIDRequest {
  string resource_id = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message GetByTimeRangeRequest {
  google.protobuf.Timestamp from = 1;
  google.protobuf.Timestamp to = 2;
  int32 limit = 3;
  int32 offset = 4;
}

message GetAuditLogsResponse {
  repeated AuditLog logs = 1;
  int64 total = 2;
}

message AuditLog {
  string id = 1;
  string aggregate_id = 2;
  string event_type = 3;
  string resource_type = 4;
  string action = 5;
  string actor_id = 6;
  string actor_type = 7;
  string organization_id = 8;
  string ip_address = 9;
  string user_agent = 10;
  string details = 11;
  string status = 12;
  string failure_reason = 13;
  google.protobuf.Timestamp created_at = 14;
  bool archived = 15;
}
